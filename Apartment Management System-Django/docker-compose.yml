services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: apartments
      POSTGRES_USER: apartments
      POSTGRES_PASSWORD: apartments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apartments -d apartments"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: apartments
      POSTGRES_USER: apartments
      POSTGRES_PASSWORD: apartments
      POSTGRES_HOST: db
      DJANGO_DEBUG: "1"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
