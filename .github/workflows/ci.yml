name: CI

on:
  push:
    branches: [main]
    paths:
      - "Apartment Management System-Django/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Apartment Management System-Django/**"
      - ".github/workflows/**"

defaults:
  run:
    working-directory: "Apartment Management System-Django"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: apartments
          POSTGRES_USER: apartments
          POSTGRES_PASSWORD: apartments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apartments -d apartments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: apartments
      POSTGRES_USER: apartments
      POSTGRES_PASSWORD: apartments
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Apartment Management System-Django/requirements.txt"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Check migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Start the stack with Docker Compose
        run: docker compose up -d --build
      - name: Wait for the app and check the login page
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/login/ > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Stop the stack
        if: always()
        run: docker compose down -v
