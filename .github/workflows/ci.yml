name: CI

on:
  push:
    branches: [main]
    paths:
      - "Apartment Management System-Django/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Apartment Management System-Django/**"
      - ".github/workflows/**"

defaults:
  run:
    working-directory: "Apartment Management System-Django"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: apartments
          POSTGRES_USER: apartments
          POSTGRES_PASSWORD: apartments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apartments -d apartments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: apartments
      POSTGRES_USER: apartments
      POSTGRES_PASSWORD: apartments
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Apartment Management System-Django/requirements.txt"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Check migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t apartment-management-django .
